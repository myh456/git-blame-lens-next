<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆形 -->
  <circle cx="64" cy="64" r="60" fill="#007ACC" stroke="#005A9E" stroke-width="2"/>
  
  <!-- Git分支图标 -->
  <g transform="translate(20, 20)">
    <!-- 主分支线 -->
    <line x1="20" y1="15" x2="20" y2="75" stroke="white" stroke-width="3" stroke-linecap="round"/>
    
    <!-- 分支线 -->
    <path d="M20 35 Q30 35 40 45 L40 65" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- 提交点 -->
    <circle cx="20" cy="15" r="4" fill="white"/>
    <circle cx="20" cy="35" r="4" fill="white"/>
    <circle cx="20" cy="55" r="4" fill="white"/>
    <circle cx="20" cy="75" r="4" fill="white"/>
    <circle cx="40" cy="45" r="4" fill="white"/>
    <circle cx="40" cy="65" r="4" fill="white"/>
  </g>
  
  <!-- Blame信息示意 -->
  <g transform="translate(50, 25)">
    <!-- 代码行背景 -->
    <rect x="0" y="10" width="55" height="8" fill="rgba(255,255,255,0.2)" rx="2"/>
    <rect x="0" y="25" width="55" height="8" fill="rgba(255,255,255,0.2)" rx="2"/>
    <rect x="0" y="40" width="55" height="8" fill="rgba(255,255,255,0.2)" rx="2"/>
    <rect x="0" y="55" width="55" height="8" fill="rgba(255,255,255,0.2)" rx="2"/>
    
    <!-- 作者信息 -->
    <text x="2" y="16" font-family="monospace" font-size="6" fill="white">2024-01 张三</text>
    <text x="2" y="31" font-family="monospace" font-size="6" fill="white">2024-01 李四</text>
    <text x="2" y="46" font-family="monospace" font-size="6" fill="white">2024-01 王五</text>
    <text x="2" y="61" font-family="monospace" font-size="6" fill="white">2024-01 赵六</text>
  </g>
  
  <!-- 放大镜图标 -->
  <g transform="translate(85, 85)">
    <circle cx="15" cy="15" r="12" fill="none" stroke="white" stroke-width="3"/>
    <line x1="25" y1="25" x2="35" y2="35" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- 装饰性光效 -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
</svg>
