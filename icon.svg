<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 主背景渐变 -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA500"/>
      <stop offset="100%" style="stop-color:#FF6347"/>
    </linearGradient>

    <!-- 代码区域渐变 -->
    <linearGradient id="codeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>
  </defs>

  <!-- 主背景 -->
  <rect width="128" height="128" rx="24" fill="url(#mainGradient)"/>

  <!-- 代码编辑器窗口 -->
  <rect x="16" y="20" width="96" height="88" rx="8" fill="rgba(255,255,255,0.95)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

  <!-- 窗口标题栏 -->
  <rect x="16" y="20" width="96" height="20" rx="8" fill="rgba(102,126,234,0.1)"/>
  <circle cx="28" cy="30" r="3" fill="#ff5f56"/>
  <circle cx="40" cy="30" r="3" fill="#ffbd2e"/>
  <circle cx="52" cy="30" r="3" fill="#27ca3f"/>

  <!-- Git blame 区域背景 -->
  <rect x="20" y="48" width="32" height="52" fill="rgba(245,87,108,0.1)" rx="4"/>

  <!-- Git blame 信息行 -->
  <g opacity="0.8">
    <!-- 第1行 -->
    <rect x="22" y="52" width="28" height="6" fill="url(#codeGradient)" rx="2"/>
    <text x="24" y="57" font-family="monospace" font-size="4" fill="white">2024-01 张三</text>

    <!-- 第2行 -->
    <rect x="22" y="62" width="28" height="6" fill="url(#codeGradient)" rx="2" opacity="0.8"/>
    <text x="24" y="67" font-family="monospace" font-size="4" fill="white">2024-01 李四</text>

    <!-- 第3行 -->
    <rect x="22" y="72" width="28" height="6" fill="url(#codeGradient)" rx="2" opacity="0.6"/>
    <text x="24" y="77" font-family="monospace" font-size="4" fill="white">2023-12 王五</text>

    <!-- 第4行 -->
    <rect x="22" y="82" width="28" height="6" fill="url(#codeGradient)" rx="2" opacity="0.9"/>
    <text x="24" y="87" font-family="monospace" font-size="4" fill="white">2024-01 赵六</text>
  </g>

  <!-- 分隔线 -->
  <line x1="54" y1="50" x2="54" y2="98" stroke="rgba(102,126,234,0.3)" stroke-width="2"/>

  <!-- 代码区域 -->
  <g opacity="0.6">
    <rect x="58" y="52" width="48" height="4" fill="#e0e0e0" rx="1"/>
    <rect x="58" y="62" width="42" height="4" fill="#e0e0e0" rx="1"/>
    <rect x="58" y="72" width="45" height="4" fill="#e0e0e0" rx="1"/>
    <rect x="58" y="82" width="38" height="4" fill="#e0e0e0" rx="1"/>
    <rect x="58" y="92" width="44" height="4" fill="#e0e0e0" rx="1"/>
  </g>

  <!-- 放大镜图标 -->
  <g transform="translate(85, 75)">
    <circle cx="12" cy="12" r="10" fill="none" stroke="white" stroke-width="3" opacity="0.9"/>
    <circle cx="12" cy="12" r="6" fill="rgba(255,255,255,0.2)"/>
    <line x1="20" y1="20" x2="28" y2="28" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Git 图标 -->
  <g transform="translate(20, 85)" opacity="0.8">
    <circle cx="6" cy="6" r="2.5" fill="white"/>
    <circle cx="6" cy="15" r="2.5" fill="white"/>
    <circle cx="15" cy="10.5" r="2.5" fill="white"/>
    <line x1="6" y1="8.5" x2="6" y2="12.5" stroke="white" stroke-width="1.5"/>
    <path d="M6 10.5 Q9 10.5 12.5 10.5" stroke="white" stroke-width="1.5" fill="none"/>
  </g>

  <!-- 装饰光效 -->
  <circle cx="96" cy="32" r="2" fill="rgba(255,255,255,0.4)"/>
  <circle cx="32" cy="96" r="1.5" fill="rgba(255,255,255,0.3)"/>
</svg>
